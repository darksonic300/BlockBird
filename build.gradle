import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
    id 'com.diffplug.spotless' version '8.2.1'
    id 'com.gradleup.shadow' version '9.6.1'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = minecraft_version + "-" + mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

spotless {
    java {
        eclipse()
        formatAnnotations()
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }


    runs {
        client {
            client()
            sourceSet = project.sourceSets.main
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    shadowed
    implementation.extendsFrom shadowed
}

dependencies {
    shadowed "jakarta.mail:jakarta.mail-api:2.1.3"
    shadowed "jakarta.activation:jakarta.activation-api:2.1.3"
    shadowed "org.eclipse.angus:jakarta.mail:2.0.4"
    shadowed "org.eclipse.angus:angus-activation:2.0.2"

    additionalRuntimeClasspath "jakarta.mail:jakarta.mail-api:2.1.3"
    additionalRuntimeClasspath "jakarta.activation:jakarta.activation-api:2.1.3"
    additionalRuntimeClasspath "org.eclipse.angus:jakarta.mail:2.0.4"
    additionalRuntimeClasspath "org.eclipse.angus:angus-activation:2.0.2"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('jar', Jar) {
    archiveClassifier.set('slim')
}

tasks.named('shadowJar', ShadowJar) {
    configurations = [project.configurations.shadowed]
    mergeServiceFiles()
    archiveClassifier.set('')
}

tasks.named('build') {
    dependsOn shadowJar
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
